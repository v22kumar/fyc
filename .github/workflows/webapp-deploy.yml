name: Deploy Member Web App

# The member app, in a browser, from the same source Android ships.
# The public Astro site deploys separately (web-deploy.yml) and stays separate
# on purpose — see docs/architecture/where-things-live.md.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/webapp-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy member web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: |
          # Create the app on first run if it does not exist yet.
          if ! flyctl status --config mobile/fly.toml > /dev/null 2>&1; then
            echo "App does not exist on Fly.io. Creating it..."
            APP_NAME=$(grep -E "^app\s*=" mobile/fly.toml | cut -d'"' -f2)
            flyctl apps create "$APP_NAME" --org personal || true
          fi
          cd mobile
          # The Google client id is not a secret (it ships in every APK), but it
          # is passed rather than hardcoded so a deploy can point at a different
          # Firebase project. Omitted entirely when unset — an empty
          # --dart-define beats the in-app default and yields a build that
          # cannot sign in with Google.
          if [ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            flyctl deploy --config fly.toml \
              --build-arg GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "::warning::GOOGLE_SERVER_CLIENT_ID not set — using the in-app default."
            flyctl deploy --config fly.toml
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
