name: CI Tests

# Sprint 1 CI hardening: before this workflow, nothing gated a merge to main —
# flutter-build.yml and fly-deploy.yml both trigger only on push to main
# (i.e. AFTER code is already merged), so a broken PR had no automated check
# to catch it before landing. This workflow runs on every PR and every branch
# push (not on main itself — main is already covered by the build/deploy
# workflows) so backend pytest and Flutter widget tests actually gate merges.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        # `python -m pytest` (not bare `pytest`) so the backend/ working
        # directory is prepended to sys.path — otherwise `import app...`
        # fails with "No module named 'app'" since there's no installed
        # package/pyproject pythonpath config making `app` importable.
        run: python -m pytest -v

  mobile-tests:
    name: Mobile — flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        # Errors always fail this step (as they should — this is the check
        # that just caught a real pre-existing bug: cached_image.dart
        # referenced an undefined ShimmerSkeleton, fixed in this same PR).
        # --no-fatal-warnings/-infos scope day-one strictness to errors only:
        # dart analyze fails on warnings by default, and this codebase has a
        # multi-sprint backlog of pre-existing lint warnings (unused imports,
        # deprecated withOpacity, etc.) across files this sprint never
        # touched. Retroactively failing every future PR on that backlog
        # would make the new gate useless noise, not stricter. Tighten this
        # once the warning backlog is paid down (tracked as a follow-up, not
        # silently dropped — see docs/SPRINT_1_STATUS.md).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: mobile
        run: flutter test

  # ── End-to-end ──────────────────────────────────────────────────────────────
  # Unit tests never caught the bugs that actually hurt: a move sent in flipped
  # coordinates, a socket that stalled mid-game, a header widget calling
  # production. Each was found by driving the real client against a real
  # backend, by hand. These jobs make that automatic, because a test nobody can
  # run is a test that stops being run.

  web-e2e:
    name: Web — real browser on a real board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Play a game in a browser
        run: ./scripts/e2e/run_web_e2e.sh

  mobile-e2e:
    name: Mobile — real widget tree on a real board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The Linux desktop embedder is what lets the real board run without a
      # phone; xvfb gives it the display it insists on having.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang xvfb

      - name: Install app dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Play a game in the real widget tree
        run: ./scripts/e2e/run_mobile_e2e.sh
