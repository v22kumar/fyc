name: Flutter Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write   # required to create / update GitHub Releases

jobs:
  build:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 1b. versionCode ──────────────────────────────────────────────────────
      # Must be strictly greater than every APK already on a device AND keep
      # increasing. Legacy field builds used ~2000+run, so a bare run number
      # (e.g. 68) is LOWER than an installed 2067 and updates never fire. Base
      # 100000 clears that ceiling with headroom and stays monotonic.
      - name: Compute versionCode
        run: echo "FYC_BUILD_NUM=$((200000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      # ── 2. Flutter SDK ───────────────────────────────────────────────────────
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Release signing ───────────────────────────────────────────────────
      # Skipped automatically if KEYSTORE_BASE64 secret is not configured.
      # Add these in GitHub → Settings → Secrets → Actions:
      #   KEYSTORE_BASE64   — base64 of fyc-release.jks
      #                       generate: keytool -genkey ... then: base64 -w0 fyc-release.jks
      #   KEY_STORE_PASSWORD — keystore password
      #   KEY_PASSWORD       — key password
      - name: Setup release signing
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::KEYSTORE_BASE64 not set — build will use debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > fyc-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=fyc\nstoreFile=../fyc-release.jks\n' \
            "$KEY_STORE_PASSWORD" "$KEY_PASSWORD" > key.properties
          echo "Release signing configured ✓"

      # ── 3b. Print release key SHA-1 (needed for Firebase/Google Sign-In) ───────
      - name: Print release key SHA-1 fingerprint
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore — skipping SHA-1 print"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/check-release.jks
          echo "=== Release Key SHA-1 (add to Firebase Console for Google Sign-In) ==="
          keytool -list -v -keystore /tmp/check-release.jks -alias fyc \
            -storepass "$KEY_STORE_PASSWORD" 2>/dev/null \
            | grep -E "SHA1:|SHA256:" | head -4
          echo "======================================================================="
          rm -f /tmp/check-release.jks

      # ── 4. Dependencies ───────────────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # ── 5. Build ──────────────────────────────────────────────────────────────
      # API_BASE_URL baked in at compile time so the APK hits production.
      # GOOGLE_SERVER_CLIENT_ID = Web OAuth client ID from Firebase Console
      #   → needed so GoogleSignIn returns a valid idToken for backend verification.
      #   Add as GitHub Secret: GOOGLE_SERVER_CLIENT_ID
      - name: Build release APKs (split per ABI — arm64, arm32, x86_64)
        working-directory: mobile
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # --build-number makes versionCode unique+increasing per build so the
          # in-app updater can detect a newer version. --build-name is the display
          # version (1.0.<run_number>).
          # Only override the Google client id when we actually have one.
          # `--dart-define=X=` is NOT the same as omitting it: an empty define
          # beats String.fromEnvironment's default, so a missing GitHub secret
          # used to ship an APK with no client id, and Google Sign-In returned a
          # null idToken with nothing in the logs naming the cause.
          GOOGLE_DEFINE=""
          if [ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            GOOGLE_DEFINE="--dart-define=GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}"
          else
            echo "::warning::GOOGLE_SERVER_CLIENT_ID secret is not set — building with the in-app default."
          fi
          flutter build apk --release --split-per-abi \
            --build-number=${{ env.FYC_BUILD_NUM }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://api.fycconnect.com \
            --dart-define=DEFAULT_ORG_ID=8f8b80b7-4b71-4770-b183-5c5f49e49a1d \
            $GOOGLE_DEFINE

      - name: Build release AAB  (Google Play Store)
        working-directory: mobile
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          AAB_BUILD_NUM=$(( FYC_BUILD_NUM + 4000 ))
          GOOGLE_DEFINE=""
          if [ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            GOOGLE_DEFINE="--dart-define=GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}"
          fi
          flutter build appbundle --release \
            --build-number=${AAB_BUILD_NUM} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://api.fycconnect.com \
            --dart-define=DEFAULT_ORG_ID=8f8b80b7-4b71-4770-b183-5c5f49e49a1d \
            $GOOGLE_DEFINE

      # ── 6. Rename outputs with stable filenames ───────────────────────────────
      - name: Rename outputs
        run: |
          # Split APKs — one per architecture
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             mobile/build/app/outputs/flutter-apk/fyc-connect-arm64.apk
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             mobile/build/app/outputs/flutter-apk/fyc-connect-arm32.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk \
             mobile/build/app/outputs/flutter-apk/fyc-connect-x86_64.apk
          # AAB
          cp mobile/build/app/outputs/bundle/release/app-release.aab \
             mobile/build/app/outputs/bundle/release/fyc-connect-latest.aab

      # ── 7. Artifacts (kept 30 days — useful for debugging) ───────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fyc-connect-apks-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/fyc-connect-arm64.apk
            mobile/build/app/outputs/flutter-apk/fyc-connect-arm32.apk
            mobile/build/app/outputs/flutter-apk/fyc-connect-x86_64.apk
          retention-days: 30

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: fyc-connect-aab-${{ github.sha }}
          path: mobile/build/app/outputs/bundle/release/fyc-connect-latest.aab
          retention-days: 30

      # ── 8. Delete stale fat APK from release (if present from old builds) ───────
      - name: Remove old fat APK from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/app-latest \
            --jq '.assets[] | select(.name=="fyc-connect-latest.apk") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            gh api --method DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID
            echo "Deleted stale fyc-connect-latest.apk from release ✓"
          else
            echo "No stale fat APK found — nothing to clean up"
          fi

      # ── 9. Publish APKs + AAB to rolling GitHub Release ─────────────────────
      # Creates or updates the "app-latest" release on every successful build.
      # Pick the APK that matches your phone:
      #   fyc-connect-arm64.apk  — most modern Android phones (2017+)  ← USE THIS
      #   fyc-connect-arm32.apk  — older/budget 32-bit Android phones
      #   fyc-connect-x86_64.apk — Android emulators
      # ── Version manifest for the in-app updater ──────────────────────────────
      # Published to the release on EVERY build via GITHUB_TOKEN, so the backend
      # always learns the latest version — no dependence on a Fly secret that can
      # silently break.
      #
      # MANDATORY defaults to FALSE, and that reversal is the point.
      #
      # It used to default to true, so every one of the ~277 builds told every
      # member "this update is required to continue". On a Play install that is
      # a trap with no exit: Play review lags behind CI by hours or days, so the
      # app demanded a version the Play Store did not yet have, and the only
      # button led to a page with no Update on it. The club was locked out of
      # its own app by its own release pipeline.
      #
      # Forcing is now expressed as a floor, not a per-build flag: set the repo
      # variable MIN_SUPPORTED_VERSION to the oldest version that still works
      # (e.g. after a breaking API change or a security fix) and only builds
      # below it are refused. Everything else updates quietly in the background,
      # the way Play already does it.
      - name: Generate version.json (in-app updater source of truth)
        run: |
          MANDATORY="${{ vars.FORCE_UPDATE }}"
          if [ "$MANDATORY" = "true" ]; then MANDATORY="true"; else MANDATORY="false"; fi
          MIN_SUPPORTED="${{ vars.MIN_SUPPORTED_VERSION }}"
          if [ -z "$MIN_SUPPORTED" ]; then MIN_SUPPORTED="0.0.0"; fi
          # The distributed APK is arm64 (apk_url below). Flutter's
          # --split-per-abi rewrites each split's versionCode to
          # (abi_offset*1000 + build-number); arm64-v8a's offset is 2, so the
          # INSTALLED arm64 versionCode is FYC_BUILD_NUM + 2000. version.json
          # must report that same offset code, otherwise (a) older clients that
          # compared versionCode saw latest <= installed forever and never
          # prompted, and (b) Android rejects the install as a downgrade.
          # Newer clients compare version_name and are offset-immune, but we
          # keep version_code truthful for the installed base still on the old
          # comparison so THIS release finally reaches them.
          ARM64_VERSION_CODE=$(( FYC_BUILD_NUM + 2000 ))
          cat > mobile/build/version.json <<JSON
          {
            "version_code": ${ARM64_VERSION_CODE},
            "version_name": "1.0.${{ github.run_number }}",
            "apk_url": "${{ github.server_url }}/${{ github.repository }}/releases/download/app-latest/fyc-connect-arm64.apk",
            "mandatory": $MANDATORY,
            "min_supported_version_name": "$MIN_SUPPORTED",
            "notes": "A new version of FYC Connect is available. Please update for the latest features and fixes."
          }
          JSON
          echo "── version.json ──"; cat mobile/build/version.json

      - name: Publish to GitHub Release (app-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "FYC Connect — Latest Android Build"
          body: |
            🤖 **Auto-built from `main`**

            | Field | Value |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Built at | ${{ github.run_started_at }} |
            | Workflow | [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ## ⬇️ Download for your device

            | File | Size | Device |
            |---|---|---|
            | **`fyc-connect-arm64.apk`** | ~40 MB | ✅ **Pixel 6a / most phones (2017+)** — download this |
            | `fyc-connect-arm32.apk` | ~36 MB | Older / budget 32-bit phones |
            | `fyc-connect-x86_64.apk` | ~43 MB | Android emulator only |

            > **First install?** Uninstall any previous FYC Connect, then install the arm64 APK.

            **Play Store upload:** use `fyc-connect-latest.aab` below.
          prerelease: true
          make_latest: false
          files: |
            mobile/build/app/outputs/flutter-apk/fyc-connect-arm64.apk
            mobile/build/app/outputs/flutter-apk/fyc-connect-arm32.apk
            mobile/build/app/outputs/flutter-apk/fyc-connect-x86_64.apk
            mobile/build/app/outputs/bundle/release/fyc-connect-latest.aab
            mobile/build/version.json

      # ── 9. Wire up backend download URL (idempotent) ─────────────────────────
      # Sets APP_APK_URL on fyc-backend so the web "Download App" button works.
      # Skipped automatically if FLY_API_TOKEN secret is not configured.
      # The GitHub Release URL is stable, so this only triggers a backend
      # redeploy the very first time (when APP_APK_URL is not yet set).
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # The APK build + GitHub release above is the deliverable. Updating Fly
      # secrets is best-effort: a transient machine-lease conflict (the backend
      # runs a single machine) must NOT fail the build or discard the published
      # APK. Hence continue-on-error + --detach + retry.
      - name: Set APP_APK_URL on backend (first build only)
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping backend URL update"
            exit 0
          fi

          APK_URL="https://github.com/${{ github.repository }}/releases/download/app-latest/fyc-connect-arm64.apk"

          CURRENT=$(flyctl secrets list --app fyc-backend --json 2>/dev/null \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(next((x['Name'] for x in s if x['Name']=='APP_APK_URL'),''))" 2>/dev/null || echo "")

          if [ -z "$CURRENT" ]; then
            echo "Setting APP_APK_URL on fyc-backend..."
            flyctl secrets set APP_APK_URL="$APK_URL" --app fyc-backend --detach || echo "::warning::APP_APK_URL set failed (non-fatal)"
          else
            echo "APP_APK_URL already configured — no backend redeploy needed ✓"
          fi

      - name: Publish latest version to backend (for in-app updater)
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping version publish"
            exit 0
          fi
          # Report the arm64 split's actual versionCode (build-number + 2000);
          # see the version.json step for why the ABI offset must be included.
          # This is only a fallback — version.json on the release is the source
          # of truth — but keep it consistent so both agree.
          ARM64_VERSION_CODE=$(( FYC_BUILD_NUM + 2000 ))
          # Retry on the single-machine lease conflict; --detach stages without
          # waiting for the machine update.
          for attempt in 1 2 3; do
            if flyctl secrets set \
                 APP_LATEST_VERSION_CODE="${ARM64_VERSION_CODE}" \
                 APP_LATEST_VERSION_NAME="1.0.${{ github.run_number }}" \
                 --app fyc-backend --detach; then
              echo "Published latest version 1.0.${{ github.run_number }} (code ${ARM64_VERSION_CODE}) ✓"
              exit 0
            fi
            echo "::warning::version publish attempt $attempt failed (lease conflict?) — retrying"
            sleep 20
          done
          echo "::warning::version publish did not succeed after retries (non-fatal)"

      # ── 12. Upload to Google Play Console ───────────────────────────────────────
      # Preflight surfaces the REAL cause of r0adkll's generic "Unknown error
      # occurred." before the upload: a missing/invalid service-account key, the
      # wrong key type, or a missing AAB. It also prints the service-account email
      # + GCP project so you can verify the Play Console invite + that the Google
      # Play Android Developer API is enabled.
      - name: Preflight — validate Play upload prerequisites
        env:
          SA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          AAB="mobile/build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB not found at $AAB"; exit 1
          fi
          echo "AAB present: $(du -h "$AAB" | cut -f1)"
          if [ -z "$SA" ]; then
            echo "::error::SERVICE_ACCOUNT_JSON secret is empty. Add the Play service-account JSON key under Settings → Secrets → Actions."
            exit 1
          fi
          printf '%s' "$SA" > /tmp/sa.json
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("/tmp/sa.json"))
          except Exception as e:
              print(f"::error::SERVICE_ACCOUNT_JSON is not valid JSON ({e}). Paste the raw key file contents, not base64.")
              sys.exit(1)
          if d.get("type") != "service_account":
              print(f"::error::Key type is {d.get('type')!r}, expected 'service_account'. Use a service-account key, not an OAuth client.")
              sys.exit(1)
          print(f"::notice::Service account = {d.get('client_email')}  — this MUST be invited in Play Console → Users & permissions with 'Release to testing tracks' for com.fycconnect.app")
          print(f"::notice::GCP project = {d.get('project_id')}  — the 'Google Play Android Developer API' must be enabled there, and the account linked under Play Console → API access")
          PY
          rm -f /tmp/sa.json

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.fycconnect.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

      # Say where the build actually went.
      #
      # "It uploads to the Play Store" and "members can get it from the Play
      # Store" are different sentences, and the gap between them is invisible
      # from here: the default track is `internal`, which never appears in Play
      # Store search and is reachable only by testers who have been added by
      # email and have opted in through a link. Somebody looking for the app in
      # the Play Store and finding nothing has no way to tell whether the
      # upload failed or was never meant to be public.
      - name: Say which Play track this went to
        if: always()
        run: |
          TRACK="${{ vars.PLAY_TRACK || 'internal' }}"
          {
            echo "## Play Console"
            echo ""
            echo "Track: **$TRACK** · version **1.0.${{ github.run_number }}**"
            echo ""
            case "$TRACK" in
              production)
                echo "Public. Visible in Play Store search once Google finishes reviewing it."
                ;;
              internal|alpha|beta)
                echo "**Not public.** This track does not appear in Play Store search."
                echo "Only testers added in Play Console → Testing → $TRACK can install it,"
                echo "and only after opening the opt-in link on that page."
                echo ""
                echo "To publish to everyone, set the repository variable"
                echo '`PLAY_TRACK=production` (Settings → Secrets and variables → Actions → Variables).'
                ;;
            esac
            echo ""
            echo "Sideload APK (no Play account needed):"
            echo "<${{ github.server_url }}/${{ github.repository }}/releases/download/app-latest/fyc-connect-arm64.apk>"
          } >> "$GITHUB_STEP_SUMMARY"
