server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Everything is revalidated. Nothing is cached blind.
    #
    # The usual static-site rule — hash the filename, then cache it for a year
    # as immutable — does not apply here, because **Flutter web fingerprints
    # nothing**. `flutter_bootstrap.js` asks for `main.dart.js` by that exact
    # name on every build, and the assets under `assets/` keep their paths too.
    # A year of `immutable` on those would strand every existing member on
    # whichever build they happened to load first: the deploy goes out, the
    # server is new, the app is old, and nothing anywhere says so. That is the
    # same shape as the outage this project has already spent an afternoon on.
    #
    # `no-cache` does not mean "do not store" — it means store it and check
    # before use. nginx answers with an ETag, the browser sends
    # If-None-Match, and an unchanged file comes back as a 304 with no body.
    # So a repeat visit still costs almost nothing, and a deploy always lands.
    location / {
        # Every path that is not a file is a route inside the app. go_router
        # reads the URL once index.html boots, so /blood-donation and
        # /blood-requests/<id> — where a blood notification lands — have to
        # serve the app rather than 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        etag on;
    }

    # No exception for CanvasKit either, tempting as it is at ~5 MB.
    #
    # The engine revision appears in the *gstatic* URL, not in ours: with
    # --no-web-resources-cdn the runtime is served from a flat /canvaskit/
    # path whose contents change on a Flutter upgrade without the path moving.
    # Caching it immutable would be the same trap as main.dart.js, just rarer
    # and harder to recognise when it happened.
    #
    # The cost of revalidating it is one conditional request answered 304 —
    # a few hundred bytes — against the risk of a member stuck on an engine
    # that no longer matches the app.

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
