server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Short share links: /e/<code> (events) and /t/<code> (tournaments) are
    # served by the tiny resolver page, which reads the code from the path,
    # looks it up via the API, and redirects to the full detail page.
    location /e/ { try_files $uri /s/index.html; }
    location /t/ { try_files $uri /s/index.html; }

    # All other requests: try file, then directory, then index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
